name: Build Android APK From Zip
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Code
        run: |
          if [ -f "MobileHost.zip" ]; then
            unzip -o MobileHost.zip
            # 智能纠错：如果解压出来发现有一个同名嵌套文件夹，把里面的所有东西提到根目录来
            if [ -d "MobileHost" ]; then
              mv MobileHost/* . 2>/dev/null || true
              mv MobileHost/.* . 2>/dev/null || true
              rm -rf MobileHost
            fi
            ls -la  # 打印一下根目录，方便看文件在不在
          else
            echo "错误：未在仓库根目录找到 MobileHost.zip 文件！"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Android Template
        run: |
          rm -rf android
          flutter create . --platforms=android

      - name: Force Upgrade Android CompileSdkVersion
        run: |
          # 兼容不同 Flutter 版本生成的 build.gradle 路径和格式
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle || true
            sed -i 's/compileSdk .*/compileSdk 36/g' android/build.gradle || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/build.gradle || true
          fi

      - name: Disable Strict Analyze Warning
        run: |
          echo -e "analyzer:\n  errors:\n    unused_import: ignore\n    unused_field: ignore" > analysis_options.yaml

      - name: Resolve Dependencies
        run: |
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilehost-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
