name: Build Android APK From Zip
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Code
        run: |
          if [ -f "MobileHost.zip" ]; then
            unzip -o MobileHost.zip
            # 智能纠错：如果解压出来发现有一个同名嵌套文件夹，把里面的所有东西提到根目录来
            if [ -d "MobileHost" ]; then
              mv MobileHost/* . 2>/dev/null || true
              mv MobileHost/.* . 2>/dev/null || true
              rm -rf MobileHost
            fi
            ls -la
          else
            echo "错误：未在仓库根目录找到 MobileHost.zip 文件！"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Android Template
        run: |
          rm -rf android
          flutter create . --platforms=android

      - name: Force Global Upgrade Android SDK 36
        run: |
          # 核心大招：在安卓根目录构建脚本末尾，强行注入全局拦截器，强制所有插件和应用统一使用 SDK 36 编译
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdk = 36
                      }
                  }
              }
          }
          EOF
          cat android/build.gradle # 打印确认注入成功

      - name: Disable Strict Analyze Warning
        run: |
          echo -e "analyzer:\n  errors:\n    unused_import: ignore\n    unused_field: ignore" > analysis_options.yaml

      - name: Resolve Dependencies
        run: |
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilehost-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
